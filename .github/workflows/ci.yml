name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:ci

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Run Windows launcher installation
        shell: cmd
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: start-windows.cmd --install-only
      - name: Check cross-platform file identity
        run: npx --no-install tsx --test test/file-system-identity.test.ts
      - name: Check native Windows recipe authoring
        run: npx --no-install tsx --test --test-name-pattern="^(new is deterministic|new serializes|Windows |report, schema)" test/recipe-authoring.test.ts
      - name: Check canonical recipe files on Windows
        run: npm run recipes:check
      - run: npm run build
