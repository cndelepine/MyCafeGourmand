name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Reject forbidden migration inputs
        run: npm run repository:safety
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build static CI artifact
        run: npm run build:ci

  windows:
    name: Validate Windows launcher
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Reject forbidden migration inputs
        run: npm run repository:safety
      - name: Run Windows launcher installation
        shell: cmd
        run: start-windows.cmd --install-only
      - name: Check cross-platform file identity
        run: npx --no-install tsx --test test/file-system-identity.test.ts
      - name: Check native Windows recipe authoring
        run: npx --no-install tsx --test --test-name-pattern="^(new is deterministic|new serializes|Windows |report, schema)" test/recipe-authoring.test.ts
      - name: Check canonical recipe files on Windows
        run: npm run recipes:check
      - name: Build static CI artifact
        run: npm run build
